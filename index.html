    <script>
      // Suppress benign Vite HMR websocket disconnection errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket closed without opened') ||
            String(event.reason?.message || '').includes('WebSocket closed without opened') ||
            String(event.reason?.stack || '').includes('@vite/client'))
        ) {
          event.preventDefault();
        }
      });
    </script>
